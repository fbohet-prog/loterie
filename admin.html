<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administration - Loterie Salon des DG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="welcome admin-page">

<img
    src="logo-proximus.png"
    alt="Proximus"
    class="logo"
>

    <div class="auth-header">
        <button
            id="loginButton"
            class="auth-button"
            type="button"
        >
            Se connecter
        </button>
        <button
            id="logoutButton"
            class="auth-button logout"
            type="button"
            style="display: none;"
        >
            Déconnexion
        </button>
    </div>

    <h1>Administration de la loterie</h1>

    <section class="admin-stats">

        <div class="stat-box">
            <strong id="participantCount">0</strong>
            <span>Participants inscrits</span>
        </div>

        <div class="stat-box">
            <strong id="eligibleCount">0</strong>
            <span>Participants qualifiés</span>
        </div>

        <div class="stat-box">
            <strong id="availableCount">0</strong>
            <span>Participants encore disponibles</span>
        </div>

    </section>

    <p id="adminMessage" aria-live="polite">
        Chargement des participants...
    </p>

    <button
        id="drawButton"
        type="button"
        disabled
    >
        Tirer les 3 gagnants
    </button>

    <section
        id="resultsSection"
        class="draw-results hidden"
    >

        <h2>Résultats du tirage</h2>

        <article class="prize-card first-prize">
            <div class="medal">🥇</div>

            <h3>1er prix</h3>

            <p id="firstWinner">
                En attente du tirage
            </p>
        </article>

        <article class="prize-card second-prize">
            <div class="medal">🥈</div>

            <h3>2e prix</h3>

            <p id="secondWinner">
                En attente du tirage
            </p>
        </article>

        <article class="prize-card third-prize">
            <div class="medal">🥉</div>

            <h3>3e prix</h3>

            <p id="thirdWinner">
                En attente du tirage
            </p>
        </article>

    </section>

    <section class="admin-actions">

        <button
            id="reloadButton"
            type="button"
        >
            Recharger
        </button>

    </section>

</main>

<script src="firebase.js"></script>
<script src="admin.js"></script>

<script>
    // Handle login/logout button
    document.getElementById('loginButton').addEventListener('click', function() {
        window.location.href = 'login.html';
    });

    document.getElementById('logoutButton').addEventListener('click', function() {
        // Clear authentication and redirect
        localStorage.removeItem('authToken');
        sessionStorage.clear();
        window.location.href = 'login.html';
    });
</script>

</body>

</html>
