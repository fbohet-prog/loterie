<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon parcours - Salon des DG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome">

        logo-proximus.png

        <h1>Mon parcours</h1>

        <p id="welcome">
            Chargement de votre profil...
        </p>

        <section class="progress-section">

            <h2>Progression</h2>

            <p>
                Stands visités :
                <strong id="count">0</strong> / 10
            </p>

            <div
                class="progress-bar"
                role="progressbar"
                aria-label="Progression des stands visités"
                aria-valuemin="0"
                aria-valuemax="10"
                aria-valuenow="0"
            >
                <div id="progress"></div>
            </div>

            <p id="status" aria-live="polite">
                Chargement de votre progression...
            </p>

        </section>

        <div class="dashboard-actions">

            scanner.html
                Scanner un QR code
