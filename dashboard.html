<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon parcours - Salon des DG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome">

    <img src="logo-proximus.png"
         alt="Proximus"
        class="logo">
        
        <h1>Mon parcours</h1>

        <p id="welcome">
            Chargement de votre profil...
        </p>

        <section class="progress-section">

            <h2>Progression</h2>

            <p>
                Stands visités :
                <strong id="count">0</strong> / 10
            </p>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <p id="status" aria-live="polite">
                Chargement de votre progression...
            </p>

        </section>

        <div class="dashboard-actions">
  <a
                href="scanner.html"
                class="btn">
                Scanner un code QR
            
</a>
            

            <button id="logoutButton" type="button">
                Déconnexion
            </button>

        </div>

        <p class="powered">
            Powered by Proximus
        </p>

    </main>
    
<script type="module" src="dashboard.js"></script>

</body>

</html>
