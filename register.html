<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inscription - Salon des DG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="welcome">

<img
src="logo-proximus.png"
alt="Proximusv>

    <h1>Inscription</h1>

    <form id="registerForm">

        <label for="prenom">Prénom</label>
        <input
            type="text"
            id="prenom"
            placeholder="Prénom"
            autocomplete="given-name"
            required
        >

        <label for="nom">Nom</label>
        <input
            type="text"
            id="nom"
            placeholder="Nom"
            autocomplete="family-name"
            required
        >

        <label for="societe">Société</label>
        <input
            type="text"
            id="societe"
            placeholder="Société"
            autocomplete="organization"
        >

        <label for="email">Adresse e-mail</label>
        <input
            type="email"
            id="email"
            placeholder="Adresse e-mail"
            autocomplete="email"
            required
        >

        <label for="password">Mot de passe</label>
        <input
            type="password"
            id="password"
            placeholder="Minimum 8 caractères"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button type="submit">
            Créer mon compte
        </button>

    </form>

    <p id="message" aria-live="polite"></p>

    <p>
        <a href="index.html">Retour à l'accueil</a>
    </p>

    <p class="powered">
        Powered by Proximus
    </p>

</div>

register.jsscript>

</body>
</html>
