<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion - Salon des DG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="welcome">

    logo-proximus.png

    <h1>Connexion</h1>

    <form id="loginForm">

        <label for="email">Adresse e-mail</label>

        <input
            type="email"
            id="email"
            autocomplete="email"
            required
        >

        <label for="password">Mot de passe</label>

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Se connecter
        </button>

    </form>

    <p id="message" aria-live="polite"></p>

    <p>
        Pas encore inscrit ?
        <a href="register.html">Créer un compte</a>
    </p>

    <p>
        <a href="index.html">Retour à l'accueil</a>
    </p>

    <p class="powered">
        Powered by Proximus
    </p>

</div>

login.jsscript>

</body>
</html>
